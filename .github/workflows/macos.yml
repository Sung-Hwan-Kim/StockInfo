# macOS DMG 빌드 (Apple Silicon + Intel 유니버설)
#  - GitHub가 제공하는 macOS 가상 머신에서 빌드한다 (Mac이 따로 없어도 됨)
#  - 릴리즈를 공개하면: 그 태그를 빌드해 릴리즈에 DMG를 올린다
#  - 수동 실행 (Actions → macOS 빌드 → Run workflow): 릴리즈 태그를 적으면 그 릴리즈에 올리고, 비우면 빌드 결과만 보관
#  - 코드를 푸시하면: 빌드와 실행 확인만 한다 (결과는 Actions 실행 화면의 Artifacts에 보관)
name: macOS 빌드

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "DMG를 올릴 릴리즈 태그 (예: v1.6.0). 비우면 릴리즈에 올리지 않음"
        required: false
        default: ""
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "resources/**"
      - "CMakeLists.txt"
      - ".github/workflows/macos.yml"

permissions:
  contents: write

jobs:
  dmg:
    name: DMG (Apple Silicon + Intel)
    runs-on: macos-15
    env:
      QT_VERSION: "6.7.0"
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Qt ${{ env.QT_VERSION }} 설치
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: 버전과 파일 이름
        id: meta
        run: |
          version=$(sed -n 's/^project(StockInfo VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
              echo "::error::릴리즈 태그 형식이 아닙니다: $RELEASE_TAG"
              exit 1
            fi
            label="$RELEASE_TAG"
          else
            label="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=StockInfo-$label-macos.dmg" >> "$GITHUB_OUTPUT"

      - name: 빌드 (유니버설)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --parallel
          bin=build/StockInfo.app/Contents/MacOS/StockInfo
          lipo -info "$bin"
          echo "StockInfo:"; otool -l "$bin" | grep -A4 LC_BUILD_VERSION | grep -E "minos|sdk" | sort -u
          echo "QtCore:"; otool -l "$QT_ROOT_DIR/lib/QtCore.framework/QtCore" | grep -A4 LC_BUILD_VERSION | grep -E "minos" | sort -u
          plutil -p build/StockInfo.app/Contents/Info.plist

      - name: DMG 만들기
        env:
          FILE: ${{ steps.meta.outputs.file }}
        run: |
          app=build/StockInfo.app
          # Qt 프레임워크와 플러그인을 앱 안에 넣는다
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -always-overwrite
          find "$app/Contents/PlugIns" -name '*.dylib' | sort

          # 시세 조회(HTTPS)에 필요한 TLS 플러그인 확인
          if ! ls "$app"/Contents/PlugIns/tls/libqsecuretransportbackend.dylib >/dev/null 2>&1; then
            echo "::error::TLS 플러그인(libqsecuretransportbackend.dylib)이 들어가지 않았습니다"
            exit 1
          fi

          # Apple 개발자 인증서가 없으므로 임시(ad-hoc) 서명 (Apple Silicon에서 실행하려면 서명이 있어야 함)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # 끌어다 놓아 설치하는 DMG (앱 + 응용 프로그램 폴더 바로가기)
          mkdir -p dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "StockInfo" -srcfolder dmg -ov -format UDZO "$FILE"
          ls -la "$FILE"

      - name: 실행해 보기
        env:
          TZ: Asia/Seoul
          FILE: ${{ steps.meta.outputs.file }}
        run: |
          mkdir -p shots
          # DMG에서 꺼낸 앱을 그대로 실행 (사용자가 설치하는 것과 같은 파일)
          hdiutil attach "$FILE" -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/dmg/StockInfo.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/StockInfo.app"

          open "$app" --stdout "$PWD/shots/app.log" --stderr "$PWD/shots/app.log"
          sleep 20
          pid=$(pgrep -f "StockInfo.app/Contents/MacOS/StockInfo" || true)
          if [ -z "$pid" ]; then
            cat shots/app.log
            echo "::error::프로그램이 실행 직후 종료되었습니다"
            exit 1
          fi
          screencapture -x shots/macos-main.png || echo "::warning::화면을 찍지 못했습니다"

          # 정상 종료 요청 → 설정 파일이 저장되는지 확인 (응답이 없으면 20초 뒤 포기)
          perl -e 'alarm 20; exec @ARGV' osascript -e 'tell application id "com.stockinfo.viewer" to quit' || true
          for i in $(seq 1 10); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::종료 요청에 응답하지 않아 강제로 끝냅니다"
            kill "$pid" || true
          fi
          cat shots/app.log

          ini=$(find "$HOME/Library/Preferences" -name StockInfo.ini 2>/dev/null | head -1)
          if [ -n "$ini" ]; then
            echo "설정 파일: $ini"
            cp "$ini" shots/
          else
            echo "::warning::설정 파일이 저장되지 않았습니다"
          fi

      - name: 빌드 결과 보관
        uses: actions/upload-artifact@v7
        with:
          name: StockInfo-macos
          path: |
            ${{ steps.meta.outputs.file }}
            shots/
          if-no-files-found: error
          retention-days: 30

      - name: 릴리즈에 올리기
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.meta.outputs.file }}
        run: gh release upload "$RELEASE_TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: 요약
        env:
          FILE: ${{ steps.meta.outputs.file }}
        run: |
          {
            echo "### $FILE"
            echo '```'
            shasum -a 256 "$FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
